<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product_name }} | {{ page_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v={{ css_hash }}">
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    {# Shared incident rendering, loaded before app.js which consumes it. #}
    <script src="{{ url_for('static', path='js/incidents.js') }}?v={{ incidents_hash }}" defer></script>
    <script src="{{ url_for('static', path='js/app.js') }}?v={{ js_hash }}" defer></script>
</body>
</html>
